<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List in HTML</title>
</head>
<body>
    <h6>unordered list</h6>
    <!--ul: unordered list-->
    <!--type: disc(default), circle, square, none-->
    <ul type="square">
        <!--li: list of items-->
        <li>English</li>
        <li>Hindi</li>
        <li>Maths</li>
    </ul>
<h6>ordered list</h6>
<!--ol: orderd list-->
<!--type: 1(default), a, A, i, I, reversed=true-->
<ol type="1" reversed="true">
    <li>English</li>
    <ul>
        <li>Grammar</li>
        <li>Words</li>
    </ul>
    <li>Hindi</li>
    <li>Maths</li>
</ol>
<h6>Defination List</h6>
<!--dl : defination list-->
<dl>
    <!--dt: defination term-->
    <dt>html</dt>
    <!--dd: defination description-->
    <dd>hyper text markup language</dd>
    <dt>CSS</dt>
    <dd>Cascade Style Sheets</dd>
</dl>
</body>
</html>
