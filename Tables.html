<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
<table border="">
    <caption>My Famiy Details</caption>
    <colgroup>
    <col span="2" style="background-color: red;">
    <col span="2" style="background-color: green;">
    </colgroup>
    <!--tr: table row-->
    <tr>
        <!--th : table head(Highlight), td: table data(normal)-->
        <th>Col1</th>
        <th>Col2</th>
        <th>Col3</th>
        <th>Col4</th>
    </tr>
    <tr>
        <td colspan="2">Himanshu</td>
        <td>Ankit</td>
        <td>Niharika</td>
        <td>Ruttvik</td>
    </tr>
    <tr>
        <td>Benu</td>
        <td>Mammi</td>
        <td>Papa</td>
        <td>Meri Mammi</td>
    </tr>
</table>    
</body>
</html>
