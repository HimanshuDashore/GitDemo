<!DOCTYPE html>
<html>
    <head>
        <title>My First Table</title>
    
    <style>
        table {
            font-family: Arial, Helvetica, sans-serif;
            border-collapse: collapse;
            width: 100%;
        }
        td,th{
            border: 1px solid #dddddd;
            text-align: left;
            padding: 8px;
        }
        tr:nth-child(even) {
            background-color: #dddddd;
        }
    </style>
    </head>
    <body>
    <table>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Contact</th>
        </tr>
        <tr>
            <td>Himanshu Dashore</td>
            <td>33</td>
            <td>8989162523</td>
        </tr>
        <tr>
            <td>Niharika Dashore</td>
            <td>28</td>
            <td>123</td>
        </tr>
        <tr>
            <th>Ankit Dashore</th>
            <th>35</th>
            <th>123</th>
        </tr>
    </table>
    <h2>A Description List</h2>

<dl>
  <dt>Coffee</dt>
  <dd>- black hot drink</dd>
  <dt>Milk</dt>
  <dd>- white cold drink</dd>
</dl>
<h2>The unordered HTML</h2>
<ul>
    <li>Coffee</li>
    <li>Tea</li>
    <li>Water</li>
</ul>
<h2>The ordered HTML</h2>
<ol>
    <li>Coffee</li>
    <li>Tea</li>
    <li>Water</li>
</ol>
    </body>
</html>
